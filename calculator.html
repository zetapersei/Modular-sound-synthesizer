<!DOCTYPE html>\n<html lang="en">\n<head>\n    <meta charset="UTF-8">\n    <meta name="viewport" content="width=device-width, initial-scale=1.0">\n    <title>Simple Calculator</title>\n    <style>\n        body { font-family: Arial, sans-serif; }\n        #calculator { width: 200px; margin: auto; }\n        .screen { width: 100%; height: 40px; text-align: right; margin-bottom: 10px; padding: 5px; border: 1px solid #ccc; }\n        .button { width: 48%; height: 40px; margin: 1%; font-size: 16px; }\n        #equals { background-color: #4CAF50; color: white; }\n        #clear { background-color: #f44336; color: white; }\n    </style>\n</head>\n<body>\n    <div id="calculator">\n        <input type="text" class="screen" id="display" disabled />\n        <div>\n            <button class="button" onclick="appendToDisplay('7')">7</button>\n            <button class="button" onclick="appendToDisplay('8')">8</button>\n            <button class="button" onclick="appendToDisplay('9')">9</button>\n            <button class="button" onclick="setOperation('/')">/</button>\n        </div>\n        <div>\n            <button class="button" onclick="appendToDisplay('4')">4</button>\n            <button class="button" onclick="appendToDisplay('5')">5</button>\n            <button class="button" onclick="appendToDisplay('6')">6</button>\n            <button class="button" onclick="setOperation('*')">*</button>\n        </div>\n        <div>\n            <button class="button" onclick="appendToDisplay('1')">1</button>\n            <button class="button" onclick="appendToDisplay('2')">2</button>\n            <button class="button" onclick="appendToDisplay('3')">3</button>\n            <button class="button" onclick="setOperation('-')">-</button>\n        </div>\n        <div>\n            <button class="button" onclick="clearDisplay()" id="clear">C</button>\n            <button class="button" onclick="appendToDisplay('0')">0</button>\n            <button class="button" onclick="calculate()" id="equals">=</button>\n            <button class="button" onclick="setOperation('+')">+</button>\n        </div>\n    </div>\n    <script>\n        let display = document.getElementById('display');\n        let operation = '';\n        let firstValue = '';\n        let secondValue = '';\n\n        function appendToDisplay(value) {\n            display.value += value;\n        }\n\n        function setOperation(op) {\n            if (display.value === '') return;\n            firstValue = display.value;\n            operation = op;\n            display.value = '';\n        }\n\n        function calculate() {\n            if (display.value === '' || firstValue === '') return;\n            secondValue = display.value;\n            let result;\n            switch (operation) {\n                case '+': result = parseFloat(firstValue) + parseFloat(secondValue); break;\n                case '-': result = parseFloat(firstValue) - parseFloat(secondValue); break;\n                case '*': result = parseFloat(firstValue) * parseFloat(secondValue); break;\n                case '/': result = parseFloat(firstValue) / parseFloat(secondValue); break;\n            }\n            display.value = result;\n            firstValue = '';\n            secondValue = '';\n            operation = '';\n        }\n\n        function clearDisplay() {\n            display.value = '';\n            firstValue = '';\n            secondValue = '';\n            operation = '';\n        }\n    <\/script>\n</body>\n</html>
